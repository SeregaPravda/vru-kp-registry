<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Огляд — Реєстр КП ВРУ</title>
  <meta name="description" content="Єдина система реєстрації, розгляду та контролю кримінальних проваджень ВРУ.">
  <meta name="theme-color" content="#070D1A">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236D5DFB'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='24' font-weight='700' fill='white' text-anchor='middle'%3EКП%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="page-content" data-page="dashboard">
    <div class="flex-between" style="flex-wrap:wrap;gap:12px">
      <div>
        <h1 style="font-size:26px">Реєстр кримінальних проваджень ВРУ</h1>
        <p style="color:var(--muted);margin-top:4px">Єдина система реєстрації, розгляду та контролю кримінальних проваджень</p>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-primary" type="button" data-action="open-create-case">Створити провадження</button>
        <a class="btn btn-secondary" href="./registry.html">Перейти до реєстру</a>
      </div>
    </div>

    <div class="stat-grid" id="dashStatGrid"></div>

    <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:16px" class="dash-grid">
      <div class="card">
        <div class="card-head"><h2>Останні провадження</h2><span class="card-head-sub">до 7 останніх справ</span></div>
        <div id="dashRecentCases"></div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Останні дії</h2></div>
        <div id="dashActivity" style="padding:0 18px"></div>
      </div>
    </div>

    <div class="card card-pad">
      <div class="card-head" style="padding:0 0 14px;border:none"><h2>Рух справ у системі</h2></div>
      <div class="process-strip" id="dashProcessStrip"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/data.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/shell.js"></script>
  <script src="./js/create-case.js"></script>
  <script src="./js/case-drawer.js"></script>
  <script src="./js/page-dashboard.js"></script>
  <script src="./js/boot.js"></script>
</body>
</html>
